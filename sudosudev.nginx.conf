# ───────────────────────────────────────────────────────────────
#  sudosudev.com — landing (/) + React app (/app) + Flask API (/api)
#  Install as a SEPARATE file. Do NOT edit Krokee's config.
#    sudo cp sudosudev.nginx.conf /etc/nginx/sites-available/sudosudev
#    sudo ln -s /etc/nginx/sites-available/sudosudev /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  ADAPT: server_name, the dist/landing paths, the API port (8001),
#         and the ssl_certificate lines (Certbot fills these).
# ───────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sudosudev.com www.sudosudev.com;

    # ── landing (static showcase) at the root ──
    root /var/www/sudosudev/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── React app under /app ──
    location /app/ {
        alias /var/www/sudosudev/frontend/dist/;
        try_files $uri $uri/ /app/index.html;     # SPA fallback
    }
    # redirect /app -> /app/ (so the alias + fallback work)
    location = /app {
        return 301 /app/;
    }

    # ── Flask API (gunicorn on 127.0.0.1:8001) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── caching: long for media, short for css/js (avoids stale builds) ──
    location ~* \.(?:mp4|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── TLS (managed by Certbot — these lines are added automatically
    #     when you run: sudo certbot --nginx -d sudosudev.com -d www.sudosudev.com) ──
    # ssl_certificate     /etc/letsencrypt/live/sudosudev.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sudosudev.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name sudosudev.com www.sudosudev.com;
    return 301 https://$host$request_uri;
}